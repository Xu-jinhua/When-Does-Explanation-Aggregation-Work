[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "when-does-explanation-aggregation-work"
version = "0.1.0"
description = "Reproducible Phase 0/1/2 pipeline for explanation aggregation experiments"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26,<3",
  "PyYAML>=6.0.1",
  "scipy>=1.12",
]

[project.optional-dependencies]
gpu = [
  "torch>=2.3,<2.8",
  "torchvision>=0.18,<0.23",
  "timm>=1.0.7",
  "captum>=0.7",
  "einops>=0.8",
  "datasets>=2.20",
  "huggingface-hub>=0.23",
  "safetensors>=0.4.3",
  "pyarrow>=16",
  "pandas>=2.2",
  "medmnist==3.0.2",
]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5",
  "ruff>=0.5",
]

[project.scripts]
xai-exp = "xai_ensemble.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/xai_ensemble"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "gpu: requires a CUDA GPU",
  "network: requires network access",
  "slow: exceeds the unit-test budget",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
