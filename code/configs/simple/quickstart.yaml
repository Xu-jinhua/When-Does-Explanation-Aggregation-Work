schema_version: 1
# Minimal end-to-end demo: one small MedMNIST cell, one ImageNet-pretrained
# ResNet-18, and three aggregation rules evaluated on a four-method ensemble.
# Run from the repository's code/ directory:
#   xai-exp simple validate --config configs/simple/quickstart.yaml
#   xai-exp simple plan --config configs/simple/quickstart.yaml
#   xai-exp simple run --config configs/simple/quickstart.yaml
#   xai-exp simple summarize --config configs/simple/quickstart.yaml
experiment_id: quickstart
precision: fp32
seed: 20260714
# The method catalog is the locked paper roster. The ensemble below selects
# the demonstrated subset; `phase1_patch_sizes` keeps only the formal p=16
# patch variants so the demo does not generate p=8/p=14 explanations.
methods_file: methods.yaml
phase1_patch_sizes: [16]

storage:
  # Local filesystem mode: the first path segment contains no ':', so the
  # built-in local backend is used. Relative filesystem paths resolve against
  # this file's directory. For an rclone remote write 'remote:path'.
  remote_root: ./runs/quickstart/remote
  # Relative filesystem paths resolve against this file's directory.
  scratch_root: ./runs/quickstart/scratch
  # rclone_binary is optional; the loader discovers rclone on PATH.
  # The spool is a tmpfs staging area for pending shard uploads.
  spool_root: /dev/shm/xai-simple/quickstart
  spool_max_gib: 8
  # Lowered for small-disk environments; production servers should use >=32.
  spool_min_free_gib: 2

runtime:
  profile_directory: ./runs/quickstart/profiles
  database_path: ./runs/quickstart/jobs.sqlite3
  log_directory: ./runs/quickstart/logs
  gpu_ids: [0]
  shard_size: 128
  prediction_batch_size: 64
  dataloader_workers: 2
  headroom_fraction: 0.10
  max_retries: 1

datasets:
  - id: breastmnist
    registry_key: breastmnist
    # Committed demo asset generated by `xai-exp phase0 build-manifest`.
    manifest_path: ./assets/breastmnist.manifest.json
    splits: [test]
    # Provider download cache, e.g. ${HF_HOME} or ~/.cache/huggingface.
    cache_directory: ~/.cache/huggingface
    keep_provider_in_memory: false
    cache_images_in_ram: true

models:
  - id: breastmnist-resnet18
    dataset: breastmnist
    model_key: resnet18
    architecture: cnn
    num_classes: 2
    # ImageNet-1K pretrained weights downloaded automatically by timm, so the
    # demo needs no private checkpoint. Paper experiments instead use
    # `init_mode: checkpoint` with a trained reference checkpoint (see
    # `scripts/train_example.sh`).
    init_mode: imagenet1k
    # Committed demo asset generated by `xai-exp phase0 compute-means`.
    mean_path: ./assets/breastmnist-resnet18/train-image-mean
    mean_key: dataset_mean

conditions:
  - id: clean
    kind: clean

phase2:
  patch_sizes: [16]
  primary_patch_size: 16
  k: 20
  inference_batch_size: 64
  simpleavg_normalization: minmax
  rrf_c: 60
  kemeny_starts: 1
  kemeny_max_passes: 1024
  ensembles:
    - id: quickstart-cnn
      methods: [Saliency, InputXGradient, IntegratedGradients, FeatureAblation]
      rules: [SimpleAvg, Borda, Kemeny]
      include_singles: true
